name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Extract Android project
        run: tar -xzf Alart-source.tar.gz

      - name: Apply Alart v0.6.0 source update
        shell: bash
        run: |
          if [[ -f .github/alart-upgrade/patch.gz.b64 ]]; then
            if ! grep -q 'challenge_mixed_hint' Alart/app/src/main/res/values/strings.xml; then
              base64 -d .github/alart-upgrade/patch.gz.b64 | gzip -dc > /tmp/alart-v2.patch
              (cd Alart && patch --batch -p1 < /tmp/alart-v2.patch)
            fi
            if [[ ! -s Alart/app/src/main/res/drawable-nodpi/ic_launcher_foreground.webp ]]; then
              mkdir -p Alart/app/src/main/res/drawable-nodpi
              cat .github/alart-upgrade/icon.part*.b64 | base64 -d > Alart/app/src/main/res/drawable-nodpi/ic_launcher_foreground.webp
            fi
          fi

      - name: Build installable debug APK
        working-directory: Alart
        run: gradle --no-daemon assembleDebug

      - name: Verify APK and write build summary
        working-directory: Alart
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK" "$GITHUB_WORKSPACE/output/Alart-debug.apk"
          APK_SIZE=$(du -h "$APK" | cut -f1)
          APK_SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          {
            echo "## Alart APK build"
            echo "- Result: **Success**"
            echo "- APK: `Alart-debug.apk`"
            echo "- Size: **${APK_SIZE}**"
            echo "- SHA-256: `${APK_SHA}`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Alart-debug-apk
          path: output/Alart-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: Alart-source-code
          path: Alart-source.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Save refreshed source archive
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if [[ -f .github/alart-upgrade/patch.gz.b64 && -f Alart/app/src/main/res/drawable-nodpi/ic_launcher_foreground.webp ]] && grep -q 'challenge_mixed_hint' Alart/app/src/main/res/values/strings.xml; then
            tar -czf /tmp/Alart-source.tar.gz --exclude='*/build' --exclude='*/.gradle' Alart
            mv /tmp/Alart-source.tar.gz Alart-source.tar.gz
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Alart-source.tar.gz
            git rm -f .github/alart-upgrade/patch.gz.b64 .github/alart-upgrade/icon-foreground.webp.b64 .github/alart-upgrade/icon.part00.b64 .github/alart-upgrade/icon.part01.b64 .github/alart-upgrade/icon.part02.b64 .github/alart-upgrade/icon.part03.b64
            git commit -m "Release Alart v0.6.0 source update"
            git push origin HEAD:main
          fi

      - name: Run unit tests
        working-directory: Alart
        continue-on-error: true
        timeout-minutes: 10
        run: gradle --no-daemon testDebugUnitTest

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Alart-build-reports
          path: Alart/app/build/reports/
          if-no-files-found: ignore
          retention-days: 7
