name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Extract Android project
        run: tar -xzf Alart-source.tar.gz

      - name: Run unit tests
        working-directory: Alart
        run: gradle --no-daemon testDebugUnitTest

      - name: Build installable debug APK
        working-directory: Alart
        run: gradle --no-daemon assembleDebug

      - name: Verify APK and write build summary
        working-directory: Alart
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK" "$GITHUB_WORKSPACE/output/Alart-debug.apk"
          APK_SIZE=$(du -h "$APK" | cut -f1)
          APK_SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          {
            echo "## Alart APK build"
            echo "- Result: **Success**"
            echo "- APK: `Alart-debug.apk`"
            echo "- Size: **${APK_SIZE}**"
            echo "- SHA-256: `${APK_SHA}`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Alart-debug-apk
          path: output/Alart-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: Alart-source-code
          path: Alart-source.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Alart-build-reports
          path: Alart/app/build/reports/
          if-no-files-found: ignore
          retention-days: 7
